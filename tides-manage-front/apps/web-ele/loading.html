<style data-app-loading="inject-css">
  #__app-loading__.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
    transition: all 0.3s ease-out;
  }

  #__app-loading__ {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    color: #1f2937;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      Roboto,
      'Helvetica Neue',
      Arial,
      sans-serif;
  }

  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }

  .title-logo {
    width: 64px;
    height: 64px;
  }

  .title-logo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .title {
    color: #111827;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.2;
  }

  .subtitle {
    color: #64748b;
    font-size: 14px;
  }

  .loading-dots {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #0073e6;
    animation: bounce 1.2s ease-in-out infinite both;
  }

  .dot:nth-child(1) {
    animation-delay: -0.24s;
  }

  .dot:nth-child(2) {
    animation-delay: -0.12s;
  }

  .dot:nth-child(3) {
    animation-delay: 0s;
  }

  @keyframes bounce {
    0%,
    80%,
    100% {
      opacity: 0.35;
      transform: scale(0.72);
    }

    40% {
      opacity: 1;
      transform: scale(1);
    }
  }
</style>

<div id="__app-loading__">
  <div class="loading-container">
    <div class="title-logo">
      <img src="/logo.png" alt="潮声" />
    </div>
    <div class="title"><%= VITE_APP_TITLE %></div>
    <div class="subtitle">演出与电影购票后台</div>
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>
