        # 分库策略
        databaseStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: id
            # 使用id分库算法
            shardingAlgorithmName: databaseProgramGroupModModel
        # 分表策略    
        tableStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: id
            # 使用id分库算法
            shardingAlgorithmName: tableProgramGroupModModel
      # 对d_program_show_time表进行分库分表
      d_program_show_time:
        # 库为tides_program_0 tides_program_1 表为d_program_show_time_0 至 d_program_show_time_1
        actualDataNodes: ds_${0..1}.d_program_show_time_${0..1}
        # 分库策略
        databaseStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: program_id
            # 使用id分库算法
            shardingAlgorithmName: databaseProgramShowTimeModModel
        # 分表策略
        tableStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: program_id
            # 使用id分表算法
            shardingAlgorithmName: tableProgramShowTimeModModel
      # 对d_seat表进行分库分表
