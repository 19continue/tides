rules:
  - !SHARDING
    tables:
      # 对d_program表进行分库分表
      d_program:
        # 库为tides_program_0 tides_program_1 表为d_program_0 至 d_program_1
        actualDataNodes: ds_${0..1}.d_program_${0..1}
        # 分库策略
        databaseStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: id
            # 使用id分库算法
            shardingAlgorithmName: databaseProgramModModel
        # 分表策略
        tableStrategy:
          standard:
            # 使用id作为分片键
            shardingColumn: id
            # 使用id分表算法
            shardingAlgorithmName: tableProgramModModel
      # 对d_program_group表进行分库分表      
      d_program_group:
        # 库为tides_program_0 tides_program_1 表为d_program_group_0 至 d_program_group_1
